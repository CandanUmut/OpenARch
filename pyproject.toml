[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-agent"
version = "0.1.0"
description = "Windows-first repository improvement agent"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Repo Agent"}]
dependencies = [
  "typer>=0.12",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "apscheduler>=3.10",
  "httpx>=0.27",
  "keyring>=25.0",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "playwright>=1.44",
  "pywebview>=4.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
repoagent = "repo_agent.cli:app"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["repo_agent*"]

[tool.pytest.ini_options]
addopts = "-q"
