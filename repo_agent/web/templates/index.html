<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Repo Agent</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <h1>Repo Agent Dashboard</h1>
  <section>
    <h2>Repositories</h2>
    <ul>
      {% for repo in repos %}
      <li>{{ repo.full_name }} ({{ repo.local_path }})</li>
      {% else %}
      <li>No repos yet.</li>
      {% endfor %}
    </ul>
  </section>
  <section id="session">
    <h2>Session</h2>
    <div id="status">Loading...</div>
  </section>
  <script src="/static/app.js"></script>
</body>
</html>
